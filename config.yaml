# Paper trading only by default.
# Set live: true ONLY when you are ready for real-money trading.
live: false

# Symbols to watch and trade.
symbols:
  - SPY
  - AAPL
  - MSFT
  - NVDA

risk:
  max_position_usd: 50000     # Ceiling on notional per position (USD). With
                              # risk_per_trade_pct set this is only a cap, not
                              # the normal size.
  stop_loss_pct: 1.0          # Stop loss % used by strategies to compute signal stop prices
  # NOTE: this is an ABSOLUTE limit and is currently the binding one — a single
  # $50k position stopped out at 1% loses exactly $500. Donchian's ATR stop sits
  # 3-6% away, so one trade could breach this several times over before the
  # limit can react. Left unchanged deliberately (loosening a loss limit is your
  # call, not the bot's), but raise it or lower max_position_usd so the two agree.
  daily_loss_limit_usd: 500   # Flatten all & halt trading if daily P&L drops below this
  max_open_positions: 4       # Maximum number of concurrent open positions
  trailing_stop_pct: 10.0     # Trailing stop % that follows the price to lock in gains
  loser_cut_pct: 7.0          # Auto-exit any position whose unrealized loss exceeds this %

  # ── Risk-based position sizing ──────────────────────────────────────────────
  # Size is solved from the stop instead of the price:
  #     qty = (equity × risk_per_trade_pct%) / |entry − stop|
  # so every trade risks the same amount whether its stop is 1% or 6% away, and
  # positions grow as the account grows. Capped by max_position_usd and by the
  # heat limits below. Set to 0 to return to flat max_position_usd sizing.
  risk_per_trade_pct: 0.75

  # ── Portfolio risk caps ─────────────────────────────────────────────────────
  # Total open risk (Σ entry−stop × qty) may not exceed this % of equity. This
  # is the number that bounds a bad week — max_open_positions only counts
  # positions, and a position is not a unit of risk. 0 = off.
  max_portfolio_heat_pct: 4.0
  # The same cap applied within one correlation group. Four megacap US equities
  # are close to one bet; sizing them as four independent ones is how a book
  # that looks diversified takes a single concentrated loss. 0 = off.
  max_group_heat_pct: 3.0
  # Symbols that move together. Anything not listed is treated as its own group
  # and is bounded only by max_portfolio_heat_pct.
  correlation_groups:
    us_equity_beta: [SPY, AAPL, MSFT, NVDA]
  # Gross notional ceiling as % of equity. 100 = never use margin.
  max_gross_exposure_pct: 100

  # ── Drawdown throttle ───────────────────────────────────────────────────────
  # Betting a constant fraction of a shrinking account is what turns a bad run
  # into an unrecoverable one. Between derisk_start and halt, per-trade risk
  # scales down linearly to min_risk_scale; at halt, no new positions open.
  # Existing positions are NOT liquidated — dumping the book at the bottom of a
  # drawdown realises exactly the loss the throttle exists to avoid.
  derisk_start_dd_pct: 8.0    # Begin cutting size at 8% below the equity peak
  halt_dd_pct: 20.0           # Stop opening new positions at 20% below the peak
  min_risk_scale: 0.35        # Never shrink below 35% of normal size
  # Daily loss limit as % of equity. Applied together with daily_loss_limit_usd
  # by taking whichever is TIGHTER, so this can only ever reduce risk. 0 = off.
  daily_loss_limit_pct: 2.0

ai:
  enable_research: false      # Set true + add PERPLEXITY_API_KEY to .env for pre-market research
  enable_claude_filter: false # Set true + add ANTHROPIC_API_KEY to .env for Claude signal approval

strategy:
  name: orb                   # "orb", "ema", or "donchian"

  orb:
    opening_range_minutes: 15    # Observe 09:30–09:45 ET to set the range
    entry_order_type: limit      # "limit" or "market"
    eod_exit_time: "15:50"       # Flatten all positions at this time ET

  ema:
    fast_period: 9               # Fast EMA period (minutes)
    slow_period: 21              # Slow EMA period (minutes)
    entry_order_type: market     # "limit" or "market"  (market recommended for EMA)
    eod_exit_time: "15:50"       # Flatten all positions at this time ET

  # Trend + Support/Resistance breakout (set strategy.name: trend_sr to use).
  # Works on stocks and crypto. Tune & validate with the Backtest panel first.
  # See docs/trend_sr_filters.md for a full explanation of every field.
  trend_sr:
    bar_minutes: 15              # Aggregate the live feed into 15-minute candles
    ma_fast: 21                  # Fast trend MA
    ma_slow: 55                  # Slow trend MA (must be > ma_fast)
    regime_ma: 200              # Only go long above this long-term MA (0 = off)
    pivot_lookback: 20           # Bars scanned for swing pivots (support/resistance)
    pivot_strength: 3            # Bars on each side required to confirm a pivot
    atr_period: 14               # ATR window for stop distance
    atr_mult: 2.0                # Stop = entry − ATR × this
    breakout_buffer_atr: 0.25    # Close must clear the level by this × ATR to enter
    cooldown_bars: 4             # Bars to wait after an exit before re-entering
    trailing_activation_pct: 3.0 # Start trailing once up this %
    trailing_pct: 8.0            # Trail this % below the peak
    long_only: true              # No shorts (required for crypto)
    # ── Optional entry filters (0 = OFF; backtest before enabling live) ──────
    min_adx: 0.0                 # Require ADX ≥ this (skip weak trends; 20-25 typical)
    adx_period: 14               # ADX smoothing window
    volume_mult: 0.0             # Require breakout volume ≥ this × average (1.2-1.5 typical)
    volume_ma: 20                # Average-volume lookback for the volume filter

  donchian:
    lookback_days: 40            # N-day channel: buy breakout above N-day high
    trend_ma: 200                # Only trade in direction of N-day MA (0 = off)
    # Turtle-style asymmetric exit: leave on a break of this SHORTER channel
    # (40-in / 20-out). 0 = exit on the entry channel, which gives back far too
    # much open profit before reacting. Typical: lookback_days / 2.
    exit_lookback: 20
    trailing_activation_pct: 1.0 # Activate trailing stop after X% profit
    trailing_pct: 8.0            # Trail X% below the peak price
    long_only: true              # Only take long (buy) positions
